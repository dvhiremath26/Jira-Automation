name: Validate runner and reporter contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: source-repo/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm ci
        working-directory: source-repo
      - run: npm run typecheck
        working-directory: source-repo
      # The reporter fixtures intentionally use no browser and need no secrets.
      - run: npm run test:integration
